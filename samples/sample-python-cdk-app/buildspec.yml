version: 0.2

# This sample demonstrates managing CDK versions INDEPENDENTLY from ADF by
# using three isolated Python virtual environments in a single CodeBuild job:
#
#   * py-cdk-venv    -> the CDK application    (aws-cdk-lib>=2.278.0,<3.0.0)
#   * py-adf-venv    -> ADF build tooling      (aws-cdk-lib~=2.278.0, from ADF)
#   * py-lambda-venv -> the Lambda's own deps  (aws-lambda-powertools, ...)
#
# The aws-cdk-lib range the app uses (cdk/requirements.txt) is independent of
# the version ADF uses: it can resolve to a newer (or older) release than ADF's
# without either one interfering, because each lives in its own environment.
# The CDK *CLI* is installed separately, in the install phase below. It floats
# on the latest 2.x release, such that it stays compatible with the floating
# aws-cdk-lib range the app uses.
#
# The build phase prints the packages installed in py-adf-venv and
# py-cdk-venv, so you can see in the CodeBuild log which versions each one
# actually resolved.

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 24
    commands:
      # CDK CLI, managed independently of the CDK libraries. It floats on the
      # latest 2.x release, as a newer aws-cdk-lib can require a newer CLI.
      - npm install -g "aws-cdk@^2"
      - echo "Creating isolated virtual environments (CDK app, ADF, Lambda)"
      - python -m venv py-cdk-venv
      - python -m venv py-adf-venv
      - python -m venv py-lambda-venv
      # CDK application dependencies (its own aws-cdk-lib, in its own venv).
      - |
        . py-cdk-venv/bin/activate
        pip install -r cdk/requirements.txt -q
        deactivate
      # ADF build tooling, pulled from the ADF bootstrap bucket, in its own venv.
      - aws s3 cp s3://$S3_BUCKET_NAME/adf-build/ adf-build/ --recursive --only-show-errors
      - |
        . py-adf-venv/bin/activate
        pip install -r adf-build/requirements.txt -q
        deactivate

  build:
    commands:
      # 1. Build the Lambda deployment package in its OWN venv. The Lambda's
      #    third-party dependencies (Powertools, X-Ray SDK) come from its own
      #    requirements.txt and are installed next to the handler before zipping.
      - |
        . py-lambda-venv/bin/activate
        pip install \
          -r src/lambda/sample_fn/requirements.txt \
          -t src/lambda/sample_fn \
          -q
        cd src/lambda/sample_fn
        zip -r "$CODEBUILD_SRC_DIR/lambda-code.zip" . \
          -x '*.pyc' -x '*__pycache__*'
        cd "$CODEBUILD_SRC_DIR"
        deactivate
      # 2. Print the packages installed in the ADF and the CDK app venvs. This
      #    shows that each venv resolves its own dependencies, for example a
      #    different aws-cdk-lib version or a different version of a package
      #    that both depend on.
      - |
        echo "----- py-adf-venv (ADF build tooling) -----"
        py-adf-venv/bin/pip freeze
        echo "----- py-cdk-venv (CDK application) -----"
        py-cdk-venv/bin/pip freeze
      # 3. Synthesize the CloudFormation template using the CDK venv + CDK CLI.
      - |
        . py-cdk-venv/bin/activate
        cd cdk
        cdk synth > "$CODEBUILD_SRC_DIR/template.yml"
        cd "$CODEBUILD_SRC_DIR"
        deactivate
      # 4. Generate ADF parameter files using the ADF venv. The 'upload:'
      #    resolver in params/*.yml uploads lambda-code.zip to the ADF asset
      #    bucket and the 'resolve:' resolver injects the bucket name, so the
      #    template's AssetBucketParam / LambdaAssetObjectKeyParam are filled in.
      - |
        . py-adf-venv/bin/activate
        python adf-build/generate_params.py
        deactivate

artifacts:
  files:
    - template.yml
    - params/*.json
    - params/*.yml
