AWSTemplateFormatVersion: '2010-09-09'
Description: ADF CloudFormation Sample Service Catalog Product
Metadata:
  License: Apache-2.0

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - development
      - testing
    Description: The environment this product is provisioned into.

  BucketBaseName:
    Type: String
    Default: adf-sample-product-bucket
    Description: >-
      Base name for the S3 bucket. The environment and account id are
      appended to keep the bucket name globally unique.

Resources:
  SampleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketBaseName}-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  SampleBucketName:
    Description: Name of the S3 bucket provisioned via Service Catalog.
    Value: !Ref SampleBucket
